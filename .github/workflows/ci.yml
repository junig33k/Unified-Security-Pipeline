name: Security Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: unified-security-pipeline

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    - name: Code Quality Check (Linting)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Static Application Security Testing (SAST)
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -ll

    - name: Upload SAST Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-security-report
        path: bandit-report.json

    - name: Lowercase Repository Owner
      run: |
        echo "OWNER_LC=${github_repository_owner,,}" >> $GITHUB_ENV
      env:
        github_repository_owner: ${{ github.repository_owner }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest .

    - name: Container Image Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Container Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
